name: release

on:
  workflow_dispatch:

env:
  APPLICATION_NAME: upscayl-bin

jobs:
  setup:
    runs-on: ubuntu-22.04
    outputs:
      APPNAME: ${{ steps.app.outputs.APPNAME }}
      VERSION: ${{ steps.ver.outputs.VERSION }}
    steps:
      - id: app
        run: echo "APPNAME=${APPLICATION_NAME}" >> "$GITHUB_OUTPUT"
      - id: ver
        run: echo "VERSION=$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

  # ---------------- Linux ----------------
  ubuntu:
    needs: setup
    runs-on: ubuntu-22.04
    env:
      PACKAGENAME: ${{ needs.setup.outputs.APPNAME }}-${{ needs.setup.outputs.VERSION }}-linux
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout current ncnn
        uses: actions/checkout@v4
        with:
          repository: Tencent/ncnn
          ref: b16501a65edf03828dae55b4d20ccc6a6bf4a3b4
          path: ncnn-current
          submodules: recursive

      - name: Build
        run: |
          sudo apt update
          sudo apt install -y gcc-9 g++-9 libvulkan-dev glslang-tools
          export CC=gcc-9 CXX=g++-9
          mkdir build && cd build
          cmake ../src \
            -DNCNN_SOURCE_DIR=../ncnn-current \
            -DNCNN_VULKAN=ON \
            -DNCNN_VULKAN_ONLINE_SPIRV=ON \
            -DUSE_SYSTEM_NCNN=OFF \
            -DWITH_LAYER_gemm=ON \
            -DWITH_LAYER_matmul=ON \
            -DWITH_LAYER_layernorm=ON \
            -DWITH_LAYER_softmax=ON \
            -DWITH_LAYER_gelu=ON
          cmake --build . -j2

      - name: Package
        run: |
          mkdir ${{ env.PACKAGENAME }}
          cp README.md LICENSE build/${{ needs.setup.outputs.APPNAME }} ${{ env.PACKAGENAME }}
          strip ${{ env.PACKAGENAME }}/${{ needs.setup.outputs.APPNAME }}
          zip -9r ${{ env.PACKAGENAME }}.zip ${{ env.PACKAGENAME }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGENAME }}
          path: ${{ env.PACKAGENAME }}.zip

  # ---------------- macOS x86_64 ----------------
  macos-x86:
    needs: setup
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout current ncnn
        uses: actions/checkout@v4
        with:
          repository: Tencent/ncnn
          ref: b16501a65edf03828dae55b4d20ccc6a6bf4a3b4
          path: ncnn-current
          submodules: recursive

      - name: Dependencies
        run: brew install libomp glslang molten-vk vulkan-headers

      - name: Build x86_64
        run: |
          LIBOMP=$(brew --prefix libomp)
          MOLTENVK=$(brew --prefix molten-vk)
          MOLTENVK_LIB="$MOLTENVK/lib/libMoltenVK.a"
          USE_STATIC_MOLTENVK=ON
          if [ ! -f "$MOLTENVK_LIB" ]; then
            MOLTENVK_LIB="$MOLTENVK/lib/libMoltenVK.dylib"
            USE_STATIC_MOLTENVK=OFF
          fi
          mkdir build && cd build
          cmake ../src \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DUSE_STATIC_MOLTENVK=$USE_STATIC_MOLTENVK \
            -DNCNN_SOURCE_DIR=../ncnn-current \
            -DNCNN_VULKAN=ON \
            -DNCNN_VULKAN_ONLINE_SPIRV=ON \
            -DUSE_SYSTEM_NCNN=OFF \
            -DWITH_LAYER_gemm=ON \
            -DWITH_LAYER_matmul=ON \
            -DWITH_LAYER_layernorm=ON \
            -DWITH_LAYER_softmax=ON \
            -DWITH_LAYER_gelu=ON \
            -DOpenMP_C_FLAGS="-Xclang -fopenmp -I$LIBOMP/include" \
            -DOpenMP_CXX_FLAGS="-Xclang -fopenmp -I$LIBOMP/include" \
            -DOpenMP_C_LIB_NAMES=omp \
            -DOpenMP_CXX_LIB_NAMES=omp \
            -DOpenMP_libomp_LIBRARY="$LIBOMP/lib/libomp.a" \
            -DVulkan_INCLUDE_DIR="$MOLTENVK/include" \
            -DVulkan_LIBRARY="$MOLTENVK_LIB"
          cmake --build . -j4

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x86
          path: build/${{ needs.setup.outputs.APPNAME }}

  # ---------------- macOS arm64 ----------------
  macos-arm:
    needs: setup
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout current ncnn
        uses: actions/checkout@v4
        with:
          repository: Tencent/ncnn
          ref: b16501a65edf03828dae55b4d20ccc6a6bf4a3b4
          path: ncnn-current
          submodules: recursive

      - name: Dependencies
        run: brew install libomp glslang molten-vk vulkan-headers

      - name: Build arm64
        run: |
          LIBOMP=$(brew --prefix libomp)
          MOLTENVK=$(brew --prefix molten-vk)
          MOLTENVK_LIB="$MOLTENVK/lib/libMoltenVK.a"
          USE_STATIC_MOLTENVK=ON
          if [ ! -f "$MOLTENVK_LIB" ]; then
            MOLTENVK_LIB="$MOLTENVK/lib/libMoltenVK.dylib"
            USE_STATIC_MOLTENVK=OFF
          fi
          mkdir build && cd build
          cmake ../src \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DUSE_STATIC_MOLTENVK=$USE_STATIC_MOLTENVK \
            -DNCNN_SOURCE_DIR=../ncnn-current \
            -DNCNN_VULKAN=ON \
            -DNCNN_VULKAN_ONLINE_SPIRV=ON \
            -DUSE_SYSTEM_NCNN=OFF \
            -DWITH_LAYER_gemm=ON \
            -DWITH_LAYER_matmul=ON \
            -DWITH_LAYER_layernorm=ON \
            -DWITH_LAYER_softmax=ON \
            -DWITH_LAYER_gelu=ON \
            -DOpenMP_C_FLAGS="-Xclang -fopenmp -I$LIBOMP/include" \
            -DOpenMP_CXX_FLAGS="-Xclang -fopenmp -I$LIBOMP/include" \
            -DOpenMP_C_LIB_NAMES=omp \
            -DOpenMP_CXX_LIB_NAMES=omp \
            -DOpenMP_libomp_LIBRARY="$LIBOMP/lib/libomp.a" \
            -DVulkan_INCLUDE_DIR="$MOLTENVK/include" \
            -DVulkan_LIBRARY="$MOLTENVK_LIB"
          cmake --build . -j4

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm
          path: build/${{ needs.setup.outputs.APPNAME }}

  # ---------------- macOS Universal ----------------
  macos-universal:
    needs: [setup, macos-x86, macos-arm]
    runs-on: macos-14
    env:
      PACKAGENAME: ${{ needs.setup.outputs.APPNAME }}-${{ needs.setup.outputs.VERSION }}-macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Universal Binary
        run: |
          mkdir ${{ env.PACKAGENAME }}
          cp README.md LICENSE ${{ env.PACKAGENAME }}
          lipo -create \
            artifacts/macos-x86/${{ needs.setup.outputs.APPNAME }} \
            artifacts/macos-arm/${{ needs.setup.outputs.APPNAME }} \
            -o ${{ env.PACKAGENAME }}/${{ needs.setup.outputs.APPNAME }}
          strip ${{ env.PACKAGENAME }}/${{ needs.setup.outputs.APPNAME }}
          zip -9r ${{ env.PACKAGENAME }}.zip ${{ env.PACKAGENAME }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGENAME }}
          path: ${{ env.PACKAGENAME }}.zip

  # ---------------- Windows ----------------
  windows:
    needs: setup
    runs-on: windows-latest
    env:
      PACKAGENAME: ${{ needs.setup.outputs.APPNAME }}-${{ needs.setup.outputs.VERSION }}-windows
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout current ncnn
        uses: actions/checkout@v4
        with:
          repository: Tencent/ncnn
          ref: b16501a65edf03828dae55b4d20ccc6a6bf4a3b4
          path: ncnn-current
          submodules: recursive

      - name: Vulkan SDK
        run: |
          choco install vulkan-sdk -y --no-progress

      - name: Build
        run: |
          $sdk = Get-ChildItem "C:\VulkanSDK" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw "Vulkan SDK was not installed under C:\VulkanSDK" }
          $env:VULKAN_SDK=$sdk.FullName
          mkdir build; cd build
          cmake -A x64 ../src `
            -DNCNN_SOURCE_DIR="../ncnn-current" `
            -DNCNN_VULKAN=ON `
            -DNCNN_VULKAN_ONLINE_SPIRV=ON `
            -DUSE_SYSTEM_NCNN=OFF `
            -DWITH_LAYER_gemm=ON `
            -DWITH_LAYER_matmul=ON `
            -DWITH_LAYER_layernorm=ON `
            -DWITH_LAYER_softmax=ON `
            -DWITH_LAYER_gelu=ON
          cmake --build . --config Release --target upscayl-bin

      - name: Package
        run: |
          mkdir "${{ env.PACKAGENAME }}"
          Copy-Item README.md, LICENSE, "build/Release/${{ needs.setup.outputs.APPNAME }}.exe" -Destination "${{ env.PACKAGENAME }}"
          7z a "${{ env.PACKAGENAME }}.zip" "${{ env.PACKAGENAME }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGENAME }}
          path: ${{ env.PACKAGENAME }}.zip

  # ---------------- GitHub Release ----------------
  release:
    needs: [ubuntu, macos-universal, windows, setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.setup.outputs.VERSION }}
          name: upscayl-bin-${{ needs.setup.outputs.VERSION }}
          files: artifacts/**/**/*.zip
